<svg xmlns="http://www.w3.org/2000/svg" class="systems-svg" viewBox="0 0 1204 333" role="img" aria-labelledby="arch-tobe-title arch-tobe-desc">
        <title id="arch-tobe-title">Blueprint objetivo de originación</title><desc id="arch-tobe-desc">El cliente usa el canal digital o asistido. La orquestación mantiene la solicitud y recibe el dictamen del motor con control humano. El buró se consulta por vigencia. La aceptación habilita la apertura, el sistema solicita el realce físico cuando corresponda y queda evidencia documental.</desc>
        <style>
.architecture-board { padding-block:18px; }
.architecture-board h1 { max-width:none; font-size:clamp(34px,3.75cqw,55px); margin-bottom:10px; text-wrap:pretty; }
.architecture-board .trace-tabs { margin:7px 0 5px; }
.trace-tab-label { align-self:center; margin-right:4px; color:var(--bank-blue); font:750 12px/1.2 Arial, Helvetica, sans-serif; }
.systems-map { border:1px solid #b7c8dc; background:#fffdf6; border-radius:7px; }
.systems-scroll { overflow:auto; border-radius:inherit; }
.systems-svg { display:block; width:100%; height:auto; max-height:310px; font-family:Arial, Helvetica, sans-serif; }
.map-bank { fill:#ebf2f9; stroke:#b7c8dc; stroke-width:1.2; }
.map-external { fill:#f6f2e9; stroke:#b7afa0; stroke-width:1.2; stroke-dasharray:4 3; }
.map-region-label { font-size:8.5px; letter-spacing:.11em; font-weight:760; fill:#435a73; }
.map-edge path { stroke:#5b7794; fill:none; stroke-width:1.6; }
.map-edge text { fill:#435b76; font-size:11px; font-weight:660; paint-order:stroke; stroke:#fffdf6; stroke-width:2.6px; stroke-linejoin:round; }
.map-edge.gap path { stroke:#a8333a; stroke-width:2.05; stroke-dasharray:5 2; }
.map-edge.gap text { fill:#912b34; font-weight:770; }
.map-edge.improve path { stroke:#3b6c9a; stroke-width:2.15; }
.map-edge.improve text { fill:#1f4e7b; font-weight:770; }
.map-edge.highlight path { stroke-width:3.2; }
.map-edge.highlight text { fill:#183c65; font-weight:825; }
.map-arrow { fill:#5b7794; }
.map-arrow.gap { fill:#a8333a; }
.map-arrow.improve { fill:#3b6c9a; }
.map-node-box { fill:#ffffff; stroke:#acbfd1; stroke-width:1.15; }
.map-icon-disc { fill:#dce8f4; }
.map-icon { fill:none; stroke:#365e86; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
.map-kind { fill:#48607b; font-size:9.3px; font-weight:760; }
.map-title { fill:#193450; font-size:13.5px; font-weight:790; }
.map-note { fill:#415971; font-size:10.4px; }
.map-node.gap .map-node-box { fill:#fff1ed; stroke:#b34a50; stroke-width:1.8; }
.map-node.gap .map-icon-disc { fill:#f1d7d6; }
.map-node.gap .map-icon,.map-node.gap .map-kind { stroke:#98313b; }
.map-node.gap .map-kind { stroke:none; fill:#98313b; }
.map-node.new .map-node-box { fill:#edf4fb; stroke:#84a5c6; }
.map-node.highlight .map-node-box { fill:#f6e9bd; stroke:#3b6c9a; stroke-width:2.5; }
.map-node.highlight .map-icon-disc { fill:#f0dfab; }
